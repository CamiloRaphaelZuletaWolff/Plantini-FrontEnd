name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test & web export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Dummy public values so the web bundle builds; nothing is contacted.
      # Real values live in Vercel → Project → Settings → Environment Variables.
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      EXPO_PUBLIC_GEMINI_BASE_URL: https://example.onrender.com
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      # Same command Vercel runs — catches native-only imports on web early.
      - name: Web export
        run: npx expo export --platform web

      - name: Verify export output
        run: test -f dist/index.html
